 // Dedicated 3D Studio Preview Scene & Renderer
 let pScene=null,pCam=null,pRen=null,pChar=null,pPed=null;
 function initPreview(cv){
  if(!pScene){
   pScene=new T.Scene();
   pCam=new T.PerspectiveCamera(34,148/168,.1,30);
   pScene.add(new T.AmbientLight(0xffffff,.78));
   const dl=new T.DirectionalLight(0xfff5e0,.85);dl.position.set(3,5,4);pScene.add(dl);
   const bl=new T.DirectionalLight(0x90caf9,.4);bl.position.set(-3,2,-3);pScene.add(bl);
   pPed=new T.Group();pScene.add(pPed);
   const pd=new T.Mesh(new T.CylinderGeometry(1.05,1.18,.18,24),new T.MeshLambertMaterial({color:0xd9a066}));
   pd.position.y=-.09;pPed.add(pd);
   const pr=new T.Mesh(new T.CylinderGeometry(.92,.92,.04,24),new T.MeshLambertMaterial({color:0xfff3d6}));
   pr.position.y=.01;pPed.add(pr);
  }
  pRen=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  pRen.setSize(148,168,false);
  pRen.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  rebuildPreviewModel();
 }
 function rebuildPreviewModel(){
  if(!pScene)return;
  if(pChar)pScene.remove(pChar);
  pChar=chibi(Object.assign({kind:'human',s:.82},APP));
  pChar.rotation.y=rotY;
  pScene.add(pChar);
 }
 window.__rebuildCustPreview=rebuildPreviewModel;

 // Animate 3D Studio Preview when Mirror is open
 function tickPreview(){
  requestAnimationFrame(tickPreview);
  if(window.PI_EMOTE&&window.PI_EMOTE.t>0){
   window.PI_EMOTE.t-=0.016;
   if(window.PI_EMOTE.t<=0)window.PI_EMOTE.type=null;
   else if(window.PI_EMOTE.type==='spin'&&pl){pl.rotation.y+=0.18;rotY+=0.14}
  }
  if(cu.style.display!=='block'||!pRen||!pChar)return;
  const t=performance.now()*.001;
  if(!dragging&&(!window.PI_EMOTE||window.PI_EMOTE.type!=='spin'))rotY=Math.sin(t*.55)*.38;
  pChar.rotation.y=rotY;
  animChar(pChar,t,true);
  if(zoomFace){
   pCam.position.set(0,2.05,2.65);
   pCam.lookAt(0,1.88,0);
  }else{
   pCam.position.set(0,1.45,4.75);
   pCam.lookAt(0,1.12,0);
  }
  pRen.render(pScene,pCam);
 }
 requestAnimationFrame(tickPreview);

  opts=opts||{};

// Record a deed witnessed by nearby NPCs + Faction Ripple Effects
function recordDeed(type,desc,opts={}){
 const px=opts.x!==undefined?opts.x:P.x,pz=opts.z!==undefined?opts.z:P.z,rad=opts.rad||26;
 const witnesses=[];
 if(opts.target)witnesses.push(opts.target);
 allNames().forEach(nm=>{
  if(witnesses.includes(nm))return;
  const o=getNPCObj(nm);if(!o||!o.g||!o.g.visible)return;
  if(Math.hypot(o.g.position.x-px,o.g.position.z-pz)<=rad)witnesses.push(nm);
 });
 if(!witnesses.length&&opts.globalWitness)witnesses.push(opts.globalWitness);

 const bonusRose=NEM.relics['charm_posy']?5:0;
 const bonusPen=NEM.relics['charm_quill']?1.4:1;

 witnesses.forEach((nm,idx)=>{
  const st=ensureNPC(nm),p=PROFILES[nm]||{likeAct:[],hateAct:[]};
  const liked=(p.likeAct||[]).includes(type),hated=(p.hateAct||[]).includes(type);
  let da=(opts.aff||0)+(type==='gift'?bonusRose:0),dt=Math.round((opts.trust||0)*bonusPen),dg=opts.grudge||0,dr=Math.round((opts.respect||0)*bonusPen);
  if(liked){da+=6;dt+=4;dr+=5;dg=Math.max(-8,dg-5)}
  if(hated){da-=8;dt-=6;dg+=15}
  st.aff=Math.max(0,Math.min(100,st.aff+da));
  st.trust=Math.max(0,Math.min(100,st.trust+dt));
  st.grudge=Math.max(0,Math.min(100,st.grudge+dg));
  st.respect=Math.max(0,Math.min(100,st.respect+dr));
  if(liked)st.goalProg=Math.min(100,(st.goalProg||0)+10);
  // Faction ripple: bestie & rival react when target is directly impacted
  if(idx===0&&opts.target===nm&&(Math.abs(dg)>=12||Math.abs(da)>=12)){
   if(p.bestie&&NEM.npc[p.bestie]){
    const bst=ensureNPC(p.bestie);
    if(dg>=12){bst.grudge=Math.min(100,bst.grudge+8);bst.heard.unshift(`Furious that you wronged their bestie ${nm}!`)}
    if(da>=12){bst.aff=Math.min(100,bst.aff+6);bst.heard.unshift(`Touched by how kindly you treated their bestie ${nm}!`)}
   }
   if(p.rival&&NEM.npc[p.rival]){
    const rvt=ensureNPC(p.rival);
    if(dg>=12){rvt.respect=Math.min(100,rvt.respect+5);rvt.heard.unshift(`Amused that you clashed with their rival ${nm}!`)}
   }
  }
  const memTxt=idx===0&&opts.target===nm?desc:`Saw you ${desc}`;
  st.memories.unshift({t:type,txt:memTxt,val:dg>4?'bad':(da>0||dr>0?'good':'neutral'),day:dc});
  if(st.memories.length>10)st.memories.length=10;
  if(dg>=8||da>=6||opts.rumor){
   const rTxt=`${nm} (${p.fac||'Island'}) spread word how they ${memTxt.toLowerCase()}.`;
   if(!NEM.rumors.some(r=>r.txt===rTxt)){
    NEM.rumors.unshift({from:nm,type,txt:rTxt,val:dg>=8?'bad':'good',day:dc});
    if(NEM.rumors.length>22)NEM.rumors.length=22;
   }
  }
 });
 updateHierarchy();
 allNames().forEach(refreshBadge);
 if(witnesses.length)addLog(`👁️ ${witnesses.join(', ')}: ${desc}`);
 saveNem();
}

const np=$('nemp');let ntab='minds';
function canFulfillBundle(b){
 for(const k in b.cost){
  const need=b.cost[k];
  const cur=k==='bells'?bells:k==='fish'?inv.cf.length:k==='bug'?inv.cb.length:(inv[k]||0);
  if(cur<need)return false;
 }
 return true;
}
function payBundle(b){
 for(const k in b.cost){
  const need=b.cost[k];
  if(k==='bells')bells-=need;
  else if(k==='fish')inv.cf.splice(0,need);
  else if(k==='bug')inv.cb.splice(0,need);
  else inv[k]=(inv[k]||0)-need;
 }
 syncInv();
}

// ---- Mount / Dismount Horse Mechanics ----
function toggleMountHorse(p){
 if(IN){say('Step outside first before riding '+p.name+'! 🐴',2600);return}
 if(mountedHorse===p){
  mountedHorse=null;
  P.x=p.g.position.x+1.3;P.z=p.g.position.z;
  pl.position.set(P.x,0,P.z);
  refreshPetTag(p);
  say(`🐴 Dismounted ${p.name}. Good steed!`,2600);
 }else{
  mountedHorse=p;
  p.follow=false;
  P.x=p.g.position.x;P.z=p.g.position.z;P.a=p.g.rotation.y;
  refreshPetTag(p);
  ding();
  say(`🏇 Mounted ${p.name} (${p.breed})! Gallop across Pocket Island—press A (or dismount in 🐾 Pets) to hop off!`,4200);
 }
}

// ---- Interact with Any Pet or Ranch Animal (Collect Milk/Eggs/Truffles/Coins, Pet, Feed, or Ride) ----
function interactPet(p){
 p.hopTimer=.75;
 p.aff=Math.min(100,p.aff+8);
 // 1. If animal has a ready product/gift, collect it!
 if(p.ready){
  p.ready=false;p.prodTimer=25+Math.random()*20;
  const b=p.prodBells||90;
  bells+=b;gain(4);ding();
  refreshPetTag(p);savePets();hud();
  say(`${p.emoji} ${p.name} (${p.sound}): Collected ${p.prod}! +${b} 🔔 (❤️ Bond ${p.aff}/100)`,3800);
  if(typeof recordDeed==='function')recordDeed('crop',`cared for ${p.name} the ${p.spec} (${p.prod})`,{aff:5,trust:4,globalWitness:'Clover'});
  return;
 }
 // 2. If it's a horse, offer to Ride or Feed Apple!
 if(p.spec==='horse'){
  if(inv.apple>0&&p.aff<90){
   inv.apple--;p.aff=Math.min(100,p.aff+12);p.fed++;
   ding();hud();savePets();
   say(`🍎 Fed a crisp apple to ${p.name}! (${p.sound}) Now mounting up for a ride! 🏇`,3600);
  }
  toggleMountHorse(p);
  return;
 }
 // 3. If it's a dog or cat, toggle Follow Mode + affectionate reaction!
 if(p.canFollow){
  p.follow=!p.follow;
  ding();refreshPetTag(p);savePets();
  say(`${p.emoji} ${p.name} (${p.sound}): ${p.follow?'Now following you happily across the island! 💕':'Staying right here and guarding the spot! 🐾'} (❤️ Bond ${p.aff}/100)`,3800);
  return;
 }

// ---- Update All Pets & Ranch Animals Every Frame ----
function updatePets(dt){
 if(IN){
  // Keep following pets hidden or waiting outside while indoors
  return;
 }
 // If player is riding a horse, sync horse to player movement & place player in the saddle!
 if(mountedHorse){
  const h=mountedHorse;
  const dx=P.x-h.g.position.x,dz=P.z-h.g.position.z,mvDist=Math.hypot(dx,dz);
  // Boost player speed while mounted
  if(mvDist>0.001){
   P.x+=dx*.42;P.z+=dz*.42;
  }
  h.g.position.set(P.x,0,P.z);
  h.g.rotation.y=P.a;
  // Position player character seated in the saddle!
  const bob=mvDist>0.01?Math.abs(Math.sin(tm*22))*.09:0;
  pl.position.set(P.x,1.22+bob,P.z-.05);
  pl.ll.rotation.x=-.65;pl.lr.rotation.x=-.65;
  pl.ll.rotation.z=-.35;pl.lr.rotation.z=.35;
  animatePet3D(h,dt,mvDist/Math.max(.001,dt));
 }

 PETS.forEach(p=>{
  if(p===mountedHorse)return;
  // Product / Truffle / Milk / Egg / Lucky Coin timer
  if(p.owned&&p.prodBells&&!p.ready){
   p.prodTimer-=dt*(1+p.aff/150);
   if(p.prodTimer<=0){p.ready=true;refreshPetTag(p)}
  }

  const q=p.g.position;
  let mvSpeed=0;

  if(p.follow){
   // Companion Follow AI: trot toward player when > 2.6m away, teleport if > 45m
   const dx=P.x-q.x,dz=P.z-q.z,d=Math.hypot(dx,dz);
   if(d>45){
    q.x=P.x-Math.sin(P.a)*2.2;q.z=P.z-Math.cos(P.a)*2.2;
   }else if(d>2.6){
    const sp=Math.min(d-2.1,(d>6?5.8:3.4))*dt;
    q.x+=dx/d*sp;q.z+=dz/d*sp;
    p.dir=Math.atan2(dx,dz);
    p.g.rotation.y=p.dir;
    mvSpeed=sp/Math.max(.001,dt);
    p.state='walk';
   }else{
    p.state='graze';
    p.g.rotation.y=Math.atan2(dx,dz);
   }
  }else{
   // Natural Pasture / Yard Autonomous Behavior (Wander <-> Idle <-> Graze/Root/Peck)
   p.stTimer-=dt;
   if(p.stTimer<=0){
    const r=Math.random();
    if(r<.42){p.state='walk';p.stTimer=2.5+Math.random()*3.5;p.dir+=(Math.random()-.5)*2.4}
    else if(r<.82){p.state='graze';p.stTimer=3.5+Math.random()*4.5}
    else{p.state='idle';p.stTimer=2+Math.random()*3}
   }
   if(p.state==='walk'){
    const sp=(p.spec==='horse'?1.55:p.spec==='dog'?1.4:p.spec==='cat'?1.15:.85);
    q.x+=Math.sin(p.dir)*sp*dt;
    q.z+=Math.cos(p.dir)*sp*dt;
    if(Math.hypot(q.x-p.hx,q.z-p.hz)>p.rad){
     p.dir=Math.atan2(p.hx-q.x,p.hz-q.z);
    }
    let da=p.dir-p.g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));
    p.g.rotation.y+=da*Math.min(1,dt*8);
    mvSpeed=sp;
   }else{
    const dPlayer=Math.hypot(P.x-q.x,P.z-q.z);
    if(dPlayer<4.2&&p.state==='idle'){
     const ta=Math.atan2(P.x-q.x,P.z-q.z);
     let da=ta-p.g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));
     p.g.rotation.y+=da*Math.min(1,dt*5);
    }
   }
  }
  animatePet3D(p,dt,mvSpeed);
  if(Math.hypot(P.x-q.x,P.z-q.z)<2.2)push(q.x,q.z,p.spec==='horse'||p.spec==='cow'?.85:.55);
 });
}

(function(){try{

 sx=P.x,sz=P.z;let best=null;
for(const fwd of [0,-1.5,1.5,-3])for(const d of [5,6,7,4.5])for(const sd of [-1,1]){
 const x=sx+rt[0]*d*sd+fw[0]*fwd,z=sz+rt[1]*d*sd+fw[1]*fwd;
 if(Math.hypot(x-F[0],z-F[1])<9||Math.hypot(x-H.x,z-H.z)<5.5)continue;
 if(blds.some(b=>Math.hypot(b[0]-x,b[1]-z)<(b[2]||3)+2.5))continue;
 if(trees.some(t=>Math.hypot(t.x-x,t.z-z)<4))continue;
 best=[x,z];break}
if(!best)best=[sx+rt[0]*5,sz+rt[1]*5];
tree(best[0],best[1],true);window.TUT_TREE=best;
try{lab('🍎 Apple tree',best[0],5,best[1])}catch(e){}
}catch(e){console.warn('starter tree',e)}})();

const okP=(x,z,m)=>hyp(x,z)<485&&!nearR(x,z,RH+(m||2))&&!LAND.some(l=>hyp(x-l[0],z-l[1])<10)&&!(typeof inFarm==='function'&&inFarm(x,z))&&hyp(x-PX,z-PZ)>8&&hyp(x,z)>9&&!blds.some(b=>hyp(x-b[0],z-b[1])<b[2]+1.2);
// ----- props down each road (town road gets the full set) -----
const TOWNSET=['lamp','sign','bench','hay','well','picnic','lamp','planter','cart','cairn','stump','ring','lamp','bench'],OTHER=['lamp','sign','bench','stump','hay','cairn','planter'];
RP.forEach((r,ri)=>{const town=ri===3,set=town?TOWNSET:OTHER,step=town?24:48;let acc=0,next=town?26:40,n=0,tot=0;for(let i=0;i<r.length-1;i++)tot+=hyp(r[i+1][0]-r[i][0],r[i+1][1]-r[i][1]);
 for(let i=0;i<r.length-1;i++){const a=r[i],b=r[i+1],dx=b[0]-a[0],dz=b[1]-a[1],L=hyp(dx,dz)||1;
  while(next<=acc+L&&next<tot-(town?32:22)){const f=(next-acc)/L,x=a[0]+dx*f,z=a[1]+dz*f,nx=-dz/L,nz=dx/L,sd=n%2?1:-1,k=set[n%set.length],off=k==='well'||k==='ring'?6.5:k==='picnic'||k==='cart'?5.6:4.3,px=x+nx*sd*off,pz=z+nz*sd*off;
   if(okP(px,pz,2.5)){const tw=Math.atan2(-sd*nx,-sd*nz);put(k,px,pz,k==='bench'||k==='planter'||k==='picnic'?tw:k==='lamp'?0:Math.random()*6.28);if(k==='lamp'&&town&&n%3===0){const qx=x-nx*sd*off,qz=z-nz*sd*off;if(okP(qx,qz,2.5))put('lamp',qx,qz,0)}}
   n++;next+=step*(.85+Math.random()*.3)}
  acc+=L}
 if(town){const j=Math.max(1,r.length-1-Math.round(36/6)),a=r[j-1],b=r[j],dx=b[0]-a[0],dz=b[1]-a[1],L=hyp(dx,dz)||1,nx=-dz/L,nz=dx/L,yaw=Math.atan2(-nz,nx),px=b[0],pz=b[1];if(okP(px+nx*4.6,pz+nz*4.6,1)&&okP(px-nx*4.6,pz-nz*4.6,1)){put('flags',px,pz,yaw);[1,-1].forEach(q=>put('pole',px+nx*4.6*q,pz+nz*4.6*q,0))}}});
// ----- ground pickups -----
const PK=[],POP=[],FV={mush:60,berry:45,shell:110,stone:25,petal:35},QN=['mush','berry','shell','stone','petal'];
const PG={mush:FM([cy(.06,.28,0,.14,0,0xf5efe0),sp(.2,0,.3,0,0xe85d5d,1,.65,1),sp(.045,.08,.4,.05,0xffffff),sp(.04,-.09,.36,.06,0xffffff),sp(.04,0,.42,-.1,0xffffff)]),
 berry:FM([sp(.2,0,.18,0,0x4caf50,1,.7,1),...[0,1,2,3,4].map(i=>sp(.07,Math.cos(i*1.3)*.17,.3+(i%2)*.06,Math.sin(i*1.3)*.17,0x3f55c0))]),
 shell:FM([sp(.24,0,.1,0,0xffc0d0,1,.35,.85),...[-2,-1,0,1,2].map(i=>co(.03,.22,i*.07,.13,-.02,0xf08aa8,1,1,1,1.4,0,i*.3)),sp(.06,0,.05,.2,0xfff0e0)]),
 stone:FM([sp(.26,0,.14,0,GR,1.2,.65,1),sp(.14,.22,.08,.12,ST,1,.6,1)]),
 petal:FM([...[0,1,2,3,4,5].map(i=>sp(.1,Math.cos(i*1.05)*.2,.05+.01*i,Math.sin(i*1.05)*.2,[0xff9ec4,0xffc0d8,0xffffff][i%3],1.3,.25,.9)),sp(.07,0,.1,0,0xffd54f)]),
 stick:FM([cy(.04,.9,0,.08,0,W,.05,0,0,1.5708),cy(.035,.7,.05,.1,.05,0x7a4c24,.04,0,.9,1.5708),co(.05,.14,.0,.14,.0,0x58b552,1,1,.3)]),
 apple:FM([sp(.2,0,.2,0,0xe53935),cy(.015,.12,0,.42,0,0x7a4c24),sp(.07,.08,.44,0,0x58b552,1.6,.4,1)]),
 bag:FM([sp(.3,0,.28,0,0xffd54f,1,1.05,1),co(.12,.22,0,.6,0,0xffd54f,1,1,1),bx(.18,.05,.18,0,.5,0,0xe85d5d),sp(.12,0,.28,.28,0xffb300,1,1,.2)])};
const roadPt=()=>{const r=RP[Math.floor(Math.random()*RP.length)],j=1+Math.floor(Math.random()*(r.length-2)),a=r[j-1],b=r[j+1],L=hyp(b[0]-a[0],b[1]-a[1])||1,o=(Math.random()<.5?-1:1)*(3.2+Math.random()*3.8);return[r[j][0]-(b[1]-a[1])/L*o,r[j][1]+(b[0]-a[0])/L*o]},
 treePt=()=>{const t=trees[Math.floor(Math.random()*trees.length)],a=Math.random()*6.283;return t?[t.x+Math.cos(a)*2.3,t.z+Math.sin(a)*2.3]:[0,0]},
 meadowPt=()=>{const a=Math.random()*6.283,r=14+Math.random()*290;return[Math.cos(a)*r,Math.sin(a)*r]},
 beachPt=()=>{const a=Math.random()*6.283,r=468+Math.random()*16;return[Math.cos(a)*r,Math.sin(a)*r]};
const PLAN=[['mush',8,'t'],['mush',4,'r'],['berry',7,'r'],['berry',3,'m'],['stick',6,'t'],['stick',5,'r'],['petal',6,'r'],['petal',3,'m'],['stone',6,'r'],['stone',3,'b'],['apple',4,'r'],['apple',3,'t'],['bag',3,'r'],['bag',2,'m'],['shell',16,'b']];
const gen={t:treePt,r:roadPt,m:meadowPt,b:beachPt};
function topUp(){PLAN.forEach(q=>{let have=PK.filter(m=>m.userData.ty===q[0]&&m.userData.src===q[2]&&!m.userData.t).length;for(let tr=0;tr<60&&have<q[1];tr++){const p=gen[q[2]]();if(q[2]==='b'?(hyp(p[0]-FZ.c[0],p[1]-FZ.c[1])>70&&!nearR(p[0],p[1],RH+2)):(okP(p[0],p[1],2)&&hyp(p[0]-TX,p[1]-TZ)>70)){const m=new T.Mesh(PG[q[0]],FLM);m.position.set(p[0],.02,p[1]);m.rotation.y=Math.random()*6.283;m.userData={ty:q[0],src:q[2],ph:Math.random()*6.283};S.add(m);PK.push(m);have++}}})}
topUp();
const MSG={mush:['Found a mushroom! 🍄','mush'],berry:['Picked wild berries! 🫐','berry'],shell:['Found a seashell! 🐚','shell'],stone:['Picked up a stone 🪨','stone'],petal:['Gathered flower petals 🌸','petal'],stick:['Picked up a branch 🪵',null],apple:['A fallen apple! 🍎',null],bag:['A bag of bells! 💰',null]};
function take(m){const ty=m.userData.ty,d=MSG[ty];if(ty==='stick')inv.wood=(inv.wood||0)+1;else if(ty==='apple')inv.apple=(inv.apple||0)+1;else if(ty==='bag'){const b=60+Math.floor(Math.random()*140);bells+=b;say('A bag of bells! 💰 +'+b+' 🔔',2200)}else inv[d[1]]=(inv[d[1]]||0)+1;if(ty!=='bag')say(d[0],1600);try{ding()}catch(e){}try{gain(1)}catch(e){}try{hud()}catch(e){}m.userData.t=.001;POP.push(m)}
window.forageQ=()=>QN.reduce((a,k)=>a+(inv[k]||0),0);window.forageV=()=>QN.reduce((a,k)=>a+(inv[k]||0)*FV[k],0);window.forageClear=()=>QN.forEach(k=>inv[k]=0);
const _hF=hud;hud=function(){_hF();const e=document.getElementById('inv');if(e)e.textContent+=QN.map((k,i)=>(inv[k]||0)>0?'  '+['🍄','🫐','🐚','🪨','🌸'][i]+' '+inv[k]:'').join('')};
const _nF=newDay;newDay=function(){_nF();for(let i=PK.length-1;i>=0;i--)if(Math.random()<.5&&!PK[i].userData.t){S.remove(PK[i]);PK.splice(i,1)}topUp()};
const _uF=update;update=function(dt){_uF(dt);LAMPM.emissive.setHex((tod>=18||tod<6)?0xb8902f:0);
 for(let i=PK.length-1;i>=0;i--){const m=PK[i],u=m.userData;if(u.t){u.t+=dt;m.position.y+=dt*3.5;m.rotation.y+=dt*12;m.scale.setScalar(Math.max(.01,1-u.t/.35));if(u.t>.35){S.remove(m);PK.splice(i,1)}continue}
  const dx=P.x-m.position.x,dz=P.z-m.position.z;if(dx*dx+dz*dz>2500){m.visible=false;continue}m.visible=true;m.position.y=.02+Math.sin(tm*2.5+u.ph)*.03;
  if(!IN&&dx*dx+dz*dz<2.2)take(m)}};
}catch(e){console.error('props',e)}})();
